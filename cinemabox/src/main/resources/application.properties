spring.application.name=cinemabox
server.port=8080

# H2 trong bộ nhớ, chế độ MySQL. Mỗi lần khởi động chạy lại schema.sql rồi data.sql.
spring.datasource.url=jdbc:h2:mem:cinemabox;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Không để Hibernate tự sinh bảng: lược đồ do schema.sql quyết định.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Xem dữ liệu, chạy thử SQL: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:cinemabox, user sa, không mật khẩu)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
